<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
          <main>
            <div class="content">
                </div>
                    <div class="painel">
                        <input type="text" id="display">
                        </input>
                    </div>
                <div class="calc">
                <div class="botao">
                   <div class="bt-hd">
                    <button id="ac"> 
                    Limpar
                    </button>
                    <button id="limpar">Apagar</button>
                    <button id="igual"> = </button>
                   </div>
                   <div class="bt">
                     <button class="numero"> 1 </button>
                     <button class="numero"> 2 </button>
                     <button class="numero"> 3 </button>
                   </div>
                   <div class="bt">
                    <button class="numero"> 4 </button>
                    <button class="numero"> 5 </button>
                    <button class="numero"> 6 </button>
                   </div>
                      <div class="bt"> 
                        <button class="numero">7</button>
                        <button class="numero">8</button>
                        <button class="numero">9</button>
                      </div>
                         <div class="bt">
                            <button class="numero">00</button>
                            <button class="numero">0</button>
                            <button id="Decimal">.</button>
                         </div>
                </div>
               <div class="operadores">
               <span id="percent">
                <button class="percent"> % </button>
               </span> 
                <button class="operador"> + </button>
                <button class="operador"> - </button>
                <button class="operador"> x </button>
                <button class="operador"> ÷ </button>
               </div>
            </div>
             <footer>
            <div class="rodap"> 
            <p> Faça todos os testes possíveis</p>

            <a href="https://www.instagram.com/iam_lucirio?srtk=cHk5aTVmaHFuMjgz&utm_source=qr"> Deixe aqui a sua dúvida</a>
            </div>
          </footer> 
        </div>
          </main>
    </div>
    <script src="scripts.js">

    </script>
</body>
</html>
